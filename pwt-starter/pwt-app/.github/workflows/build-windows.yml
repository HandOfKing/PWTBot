# Builds the portable Windows zip and attaches it to a GitHub Release.
# Runs when you push a tag like v0.1.0 (git tag v0.1.0 && git push origin v0.1.0), or by hand from the Actions tab.
# NOTE: not run yet. It needs app/main.py (the PySide6 entry point, Phase 4/5).
name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python tests/run_all.py

      - name: Install Tesseract (bundled into the app until OCR is replaced by templates)
        run: choco install tesseract -y --no-progress

      - name: Build with PyInstaller (one-folder)
        run: >
          pyinstaller --noconfirm --windowed --name PWT
          --add-data "pwt/schema.sql;pwt"
          --add-data "pwt/templates;pwt/templates"
          --add-data "pwt/profiles;pwt/profiles"
          app/main.py

      - name: Bundle Tesseract
        shell: pwsh
        run: Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" "dist\PWT\vendor\tesseract"

      - name: Zip
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          Compress-Archive -Path dist\PWT -DestinationPath "PWT-$v-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PWT-windows
          path: PWT-*-windows.zip

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PWT-*-windows.zip
